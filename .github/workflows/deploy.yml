name: Deploy to GitHub Pages

on:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo B
        uses: actions/checkout@v2
        with:
          repository: coutcout/wizardSB.github.io  # Remplacez par votre nom d'utilisateur et le nom du repo B
          token: ${{ secrets.GHP_WSB_PAT }}  # Utilisez un Personal Access Token avec les permissions nécessaires

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.client_payload.tag }}

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Deploy to GitHub Pages"
          git push origin main